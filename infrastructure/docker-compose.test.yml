name: tera2-tests
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: tera-test, POSTGRES_DB: tera_test}
    ports: [127.0.0.1:55432:5432]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d tera_test]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: [127.0.0.1:56379:6379]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 20
