name: TERA verification
on: [push, pull_request]
jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.7', python-version: '3.12'}
      - name: Python Dependency Audit (pip-audit)
        run: |
          uv pip install pip-audit
          uv run pip-audit -r requirements.lock
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Node Dependency Audit (npm audit)
        run: npm audit --audit-level=moderate
        working-directory: frontend
        continue-on-error: true
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: tera-test, POSTGRES_DB: tera_test}
        ports: ['55432:5432']
        options: --health-cmd="pg_isready -U postgres -d tera_test" --health-interval=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.7', python-version: '3.12'}
      - run: uv sync --frozen --extra test
        working-directory: backend
      - run: uv run pytest -q --cov=app
        working-directory: backend
      - run: uv run ruff check app tests --select F
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
